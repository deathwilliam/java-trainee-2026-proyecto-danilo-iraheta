spring.application.name=api

# por defecto usa el puerto 5432, si ya lo ocupa otra instancia de PostgreSQL, hay que definir DB_PUERTO_HOST (por ejemplo 5433)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PUERTO_HOST:5432}/anticipapyme}
spring.datasource.username=${DB_USUARIO:banco}
spring.datasource.password=${DB_CLAVE:banco123}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false

# corre schema.sql al arrancar y despues de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

jwt.clave=${JWT_CLAVE}

logging.level.root=INFO
logging.level.sv.anticipapyme=INFO